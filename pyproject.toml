[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-audit-lite"
version = "0.2.1"
description = "A passive local Agent API gateway with automatic evidence alerts"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ethan Zhou"}]
readme = "README.md"
dependencies = ["aiohttp==3.13.5"]

[project.scripts]
relay-audit = "relay_audit.cli:main"

[tool.setuptools.packages.find]
include = ["relay_audit*"]
